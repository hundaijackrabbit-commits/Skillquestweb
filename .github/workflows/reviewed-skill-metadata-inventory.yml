name: Reviewed skill metadata validation

on:
  push:
    branches:
      - audit/reviewed-skill-metadata-sidebar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed skill metadata polish
        run: |
          node --input-type=module <<'NODE'
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';

          const reviewed = [
            'ai-literacy',
            'communication',
            'ai-ethics',
            'digital-literacy',
            'critical-thinking',
            'data-analysis',
            'problem-solving',
            'project-management',
            'decision-making',
            'organizational-development',
            'data-organization',
            'document-collaboration',
            'team-building',
            'performance-management',
            'strategic-planning',
            'change-management',
            'innovation-management',
          ];

          const { resolveSkillReference } = loadEffectiveSkillGraph();
          for (const reference of reviewed) {
            const skill = resolveSkillReference(reference);
            if (!skill) throw new Error(`Reviewed skill ${reference} does not resolve`);
          }

          const communication = resolveSkillReference('communication');
          if (communication?.lastUpdated !== '2026-08-14') {
            throw new Error(`Communication lastUpdated must be 2026-08-14; received ${communication?.lastUpdated ?? 'null'}`);
          }

          const ai = resolveSkillReference('ai-literacy');
          const bannedTools = ['AI platforms', 'Machine learning tools', 'Automation software', 'Analytics platforms'];
          for (const tool of bannedTools) {
            if ((ai?.tools ?? []).includes(tool)) throw new Error(`AI Literacy still contains generic tool label: ${tool}`);
          }
          const expectedTools = [
            'General-purpose AI assistants and chat interfaces',
            'Source-grounded AI search and research tools',
            'Prompt playgrounds and model-comparison interfaces',
            'AI-enabled document, spreadsheet, and presentation assistants',
            'Workflow automation builders with human-review steps',
            'Data-analysis notebooks and spreadsheet validation workflows',
            'Model cards, system cards, and vendor documentation',
          ];
          if (JSON.stringify(ai?.tools ?? []) !== JSON.stringify(expectedTools)) {
            throw new Error(`AI Literacy tools differ from reviewed tool set: ${JSON.stringify(ai?.tools ?? [])}`);
          }

          const canonicalChecks = [
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
            ['strategic-planning-1', 'strategic-planning'],
            ['change-management-2', 'change-management'],
            ['innovation-management-1', 'innovation-management'],
          ];
          for (const [reference, expected] of canonicalChecks) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expected) {
              throw new Error(`${reference}: expected ${expected}, received ${resolved?.slug ?? 'null'}`);
            }
          }

          console.log('Reviewed skill metadata polish is effective and canonical regressions passed.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
