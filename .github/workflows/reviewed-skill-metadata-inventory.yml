name: Reviewed skill metadata source trace

on:
  push:
    branches:
      - audit/reviewed-skill-metadata-sidebar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace AI Literacy and Communication metadata sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';

          const graph = loadEffectiveSkillGraph();
          const pick = (skill) => ({
            id: skill?.id,
            slug: skill?.slug,
            name: skill?.name,
            lastUpdated: skill?.lastUpdated,
            tools: skill?.tools,
            professionalContexts: skill?.professionalContexts,
            careers: skill?.careers,
            industries: skill?.industries,
            relatedSkills: skill?.relatedSkills,
          });

          const scanRoots = ['src', 'scripts'];
          const needles = ['2026-08-14', 'Analytics platforms', 'AI platforms', 'Machine learning tools', 'Automation software'];
          const matches = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/\.(json|mjs|js|ts|tsx|md|mdx)$/.test(entry.name)) {
                const text = fs.readFileSync(p, 'utf8');
                for (const needle of needles) {
                  let index = text.indexOf(needle);
                  while (index !== -1) {
                    matches.push({
                      file: p,
                      needle,
                      context: text.slice(Math.max(0, index - 220), Math.min(text.length, index + needle.length + 420)),
                    });
                    index = text.indexOf(needle, index + needle.length);
                  }
                }
              }
            }
          }
          for (const root of scanRoots) if (fs.existsSync(root)) walk(root);

          const payload = {
            effective: {
              aiLiteracy: pick(graph.resolveSkillReference('ai-literacy')),
              communication: pick(graph.resolveSkillReference('communication')),
            },
            sourceMatches: matches,
          };
          fs.writeFileSync('reviewed-skill-source-trace.json', JSON.stringify(payload, null, 2));
          console.log(JSON.stringify(payload, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-skill-source-trace
          path: reviewed-skill-source-trace.json
