name: Strategic Planning inventory

on:
  push:
    branches:
      - audit/strategic-planning-inventory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect career candidates and existing relationships
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const careers = JSON.parse(fs.readFileSync('./src/data/careers.json', 'utf8'));
          const candidates = careers.filter((career) => {
            const haystack = [career?.id, career?.slug, career?.title, career?.name].filter(Boolean).join(' ').toLowerCase();
            return /strateg|product-manager|operations-manager|management-consult|business-analyst|executive|chief/.test(haystack);
          });
          console.log('=== CAREER CANDIDATES ===');
          for (const career of candidates) {
            console.log(JSON.stringify({
              id: career.id,
              slug: career.slug,
              title: career.title ?? career.name,
              coreSkills: career.coreSkills,
              secondarySkills: career.secondarySkills,
              commonIndustries: career.commonIndustries,
              description: career.description,
            }, null, 2));
          }

          console.log('=== CAREERS ALREADY REFERENCING STRATEGIC PLANNING ===');
          for (const career of careers) {
            const text = JSON.stringify(career).toLowerCase();
            if (text.includes('strategic-planning')) {
              console.log(JSON.stringify({ id: career.id, slug: career.slug, title: career.title ?? career.name, coreSkills: career.coreSkills, secondarySkills: career.secondarySkills }, null, 2));
            }
          }
          NODE
