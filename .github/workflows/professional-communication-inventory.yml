name: Professional Communication validation

on:
  push:
    branches:
      - audit/editorial-professional-communication
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed Professional Communication guide
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';

          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const communication = resolveSkillReference('communication');
          if (!communication) throw new Error('communication does not resolve');
          if (communication.slug !== 'communication') throw new Error(`communication resolved to ${communication.slug}`);
          if (!communication.shortDefinition?.startsWith('Professional communication is the ability to create shared understanding')) {
            throw new Error('Reviewed Professional Communication definition is not effective');
          }
          if (communication.lastUpdated !== '2026-09-26') {
            throw new Error(`Expected lastUpdated 2026-09-26; received ${communication.lastUpdated}`);
          }
          if ((communication.scholarlyNotes?.length ?? 0) !== 4) {
            throw new Error(`Expected 4 scholarly notes; received ${communication.scholarlyNotes?.length ?? 0}`);
          }
          const expectedCareers = ['product-manager','project-manager','account-manager','customer-success-manager','business-analyst'];
          if (JSON.stringify(communication.careers ?? []) !== JSON.stringify(expectedCareers)) {
            throw new Error(`Career relationships differ: ${JSON.stringify(communication.careers ?? [])}`);
          }
          const expectedRelated = ['active-listening','writing-skills','public-speaking','emotional-intelligence','stakeholder-engagement'];
          for (const related of expectedRelated) {
            if (!resolveSkillReference(related)) throw new Error(`Related skill ${related} does not resolve`);
          }
          const professionalAlias = resolveSkillReference('professional-communication');
          if (professionalAlias?.slug !== 'communication') {
            throw new Error(`professional-communication should resolve to communication; received ${professionalAlias?.slug ?? 'null'}`);
          }
          const neighboringSkill = resolveSkillReference('communication-skills');
          if (neighboringSkill?.slug !== 'communication-skills') {
            throw new Error(`communication-skills must remain distinct; received ${neighboringSkill?.slug ?? 'null'}`);
          }
          const careers = JSON.parse(fs.readFileSync('./src/data/careers.json', 'utf8'));
          const careerSlugs = new Set(careers.flatMap((career) => [career.slug, career.id].filter(Boolean)));
          for (const career of expectedCareers) {
            if (!careerSlugs.has(career)) throw new Error(`Declared career ${career} is missing from careers dataset`);
          }
          const bannedEvidenceFragments = [
            '5% higher starting salaries',
            'project failure in 56% of cases',
            '40% lower turnover',
            '25% higher performance',
            'most in-demand soft skill'
          ];
          const evidenceText = `${communication.evidenceSummary ?? ''} ${(communication.scholarlyNotes ?? []).join(' ')}`;
          for (const fragment of bannedEvidenceFragments) {
            if (evidenceText.includes(fragment)) throw new Error(`Legacy evidence claim remains: ${fragment}`);
          }
          if (!(communication.tools ?? []).includes('Decision, action, and escalation logs')) {
            throw new Error('Reviewed practical tool set is not effective');
          }
          const regressionChecks = [
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
            ['strategic-planning-1', 'strategic-planning'],
            ['change-management-2', 'change-management'],
            ['innovation-management-1', 'innovation-management'],
          ];
          for (const [reference, expected] of regressionChecks) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expected) throw new Error(`${reference}: expected ${expected}, received ${resolved?.slug ?? 'null'}`);
          }
          console.log('Professional Communication guide and canonical regressions passed.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
