name: Critical Thinking inventory

on:
  push:
    branches:
      - audit/editorial-critical-thinking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory Critical Thinking
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';

          const rawSkills = JSON.parse(fs.readFileSync('./src/data/skills-1000plus.json', 'utf8'));
          const careers = JSON.parse(fs.readFileSync('./src/data/careers.json', 'utf8'));
          const paths = JSON.parse(fs.readFileSync('./src/data/skill-paths.json', 'utf8'));
          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const effective = resolveSkillReference('critical-thinking');
          const rawFamily = rawSkills.filter((skill) => {
            const name = String(skill?.name ?? '').trim().toLowerCase();
            const slug = String(skill?.slug ?? '').trim().toLowerCase();
            return name.includes('critical thinking') || slug === 'critical-thinking' || slug.startsWith('critical-thinking-');
          });
          const refs = ['critical-thinking','critical-thinking-1','critical-thinking-2']
            .map((ref) => ({ref, resolved: resolveSkillReference(ref)}))
            .map(({ref,resolved}) => ({ref, resolved: resolved ? {id:resolved.id,slug:resolved.slug,name:resolved.name} : null}));
          const careerRefs = careers.filter((career) => JSON.stringify(career).toLowerCase().includes('critical-thinking')).map((career) => ({id:career.id,slug:career.slug,title:career.title ?? career.name,coreSkills:career.coreSkills,secondarySkills:career.secondarySkills,commonIndustries:career.commonIndustries}));
          const pathRefs = paths.filter((p) => JSON.stringify(p).toLowerCase().includes('critical-thinking')).map((p) => ({id:p.id,slug:p.slug,name:p.name ?? p.title,skillSequence:p.skillSequence,relatedCareers:p.relatedCareers}));
          const payload = {effective,rawFamily,refs,careerRefs,pathRefs};
          fs.writeFileSync('critical-thinking-inventory.json',JSON.stringify(payload,null,2));
          console.log(JSON.stringify(payload,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: critical-thinking-inventory
          path: critical-thinking-inventory.json
