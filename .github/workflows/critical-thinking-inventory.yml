name: Critical Thinking final validation

on:
  push:
    branches:
      - audit/editorial-critical-thinking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Critical Thinking polish and flagship regressions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';

          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const skill = resolveSkillReference('critical-thinking');
          if (!skill) throw new Error('critical-thinking does not resolve');
          if (skill.slug !== 'critical-thinking') throw new Error(`critical-thinking resolved to ${skill.slug}`);
          if (!skill.shortDefinition?.startsWith('Critical thinking is the ability to examine a claim or decision')) throw new Error('Reviewed Critical Thinking guide is not effective');
          if (skill.lastUpdated !== '2026-09-23') throw new Error(`Critical Thinking reviewed date changed unexpectedly: ${skill.lastUpdated}`);
          if (skill.employerSignalValue !== 9) throw new Error(`Expected employerSignalValue 9; received ${skill.employerSignalValue}`);
          if (skill.featured !== true) throw new Error('Critical Thinking should be featured');

          const expectedRelated = ['data-analysis','problem-solving','ai-literacy','decision-making','research-methodology'];
          if (JSON.stringify(skill.relatedSkills ?? []) !== JSON.stringify(expectedRelated)) throw new Error(`Related skills differ: ${JSON.stringify(skill.relatedSkills ?? [])}`);
          for (const related of expectedRelated) {
            const resolved = resolveSkillReference(related);
            if (!resolved) throw new Error(`Related skill ${related} does not resolve`);
          }

          const expectedCareers = ['product-manager','data-analyst','business-analyst','data-scientist','user-researcher'];
          if (JSON.stringify(skill.careers ?? []) !== JSON.stringify(expectedCareers)) throw new Error(`Career relationships differ: ${JSON.stringify(skill.careers ?? [])}`);
          const careers = JSON.parse(fs.readFileSync('./src/data/careers.json', 'utf8'));
          const careerSlugs = new Set(careers.flatMap((career) => [career.slug, career.id].filter(Boolean)));
          for (const career of expectedCareers) if (!careerSlugs.has(career)) throw new Error(`Declared career ${career} is missing`);

          const regressions = [
            ['communication', 'communication'],
            ['professional-communication', 'communication'],
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
            ['strategic-planning-1', 'strategic-planning'],
            ['change-management-2', 'change-management'],
            ['innovation-management-1', 'innovation-management'],
          ];
          for (const [reference, expected] of regressions) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expected) throw new Error(`${reference}: expected ${expected}, received ${resolved?.slug ?? 'null'}`);
          }
          console.log('Critical Thinking polish and flagship regressions passed.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
