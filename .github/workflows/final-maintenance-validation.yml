name: Final maintenance validation

on:
  push:
    branches:
      - maintenance/final-dependency-touchups
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only
      - name: Clean install
        run: npm ci
      - name: Confirm deprecated packages are gone
        run: |
          npm ls @supabase/auth-helpers-nextjs @react-email/components @react-email/render --depth=0 || true
          if npm ls @supabase/auth-helpers-nextjs --depth=0 >/dev/null 2>&1; then
            echo "Deprecated Supabase auth helper is still installed directly."
            exit 1
          fi
          if npm ls @react-email/components --depth=0 >/dev/null 2>&1; then
            echo "Deprecated React Email components package is still installed directly."
            exit 1
          fi
      - name: Verify supported replacements
        run: npm ls @supabase/ssr react-email --depth=0
      - name: Security audit
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build
      - name: Lint touched application files
        run: npx eslint src/emails/career-guide-email.tsx src/app/api/career-guide/route.ts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after dependency cleanup"
          git push
