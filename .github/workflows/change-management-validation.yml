name: Change Management validation

on:
  push:
    branches:
      - audit/editorial-change-management-clean-slug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify effective Change Management guide
        run: |
          node --input-type=module <<'NODE'
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';
          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const checks = [
            ['change-management', 'change-management'],
            ['change-management-1', 'change-management'],
            ['change-management-2', 'change-management'],
            ['strategic-planning-1', 'strategic-planning'],
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
          ];
          for (const [reference, expectedSlug] of checks) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expectedSlug) {
              throw new Error(`${reference}: expected ${expectedSlug}, received ${resolved?.slug ?? 'null'}`);
            }
            console.log(`${reference} -> ${resolved.slug}`);
          }

          const change = resolveSkillReference('change-management');
          if (!change?.shortDefinition?.startsWith('Change management is the practice of helping')) {
            throw new Error('Reviewed Change Management definition is not effective');
          }
          if (JSON.stringify(change?.careers ?? []) !== JSON.stringify(['business-analyst'])) {
            throw new Error(`Change Management career relationships must contain only business-analyst; received ${JSON.stringify(change?.careers ?? [])}`);
          }
          if ((change?.scholarlyNotes?.length ?? 0) < 3) {
            throw new Error('Change Management evidence notes are incomplete');
          }
          if (!(change?.tools ?? []).includes('Change impact assessments')) {
            throw new Error('Change Management reviewed tools are not effective');
          }
          console.log('Reviewed Change Management content is effective.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
