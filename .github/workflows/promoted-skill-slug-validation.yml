name: Promoted skill slug validation

on:
  push:
    branches:
      - audit/promote-clean-team-performance-slugs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify effective canonical slugs
        run: |
          node --input-type=module <<'NODE'
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';
          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const expected = new Map([
            ['team-building', 'team-building'],
            ['team-building-1', 'team-building'],
            ['performance-management', 'performance-management'],
            ['performance-management-1', 'performance-management'],
            ['strategic-planning', 'strategic-planning-1'],
          ]);
          for (const [reference, expectedSlug] of expected) {
            const actual = resolveSkillReference(reference)?.slug ?? null;
            if (actual !== expectedSlug) {
              throw new Error(`${reference}: expected ${expectedSlug}, received ${actual}`);
            }
            console.log(`${reference} -> ${actual}`);
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
