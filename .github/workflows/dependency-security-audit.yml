name: Dependency security audit

on:
  push:
    branches:
      - security/dependency-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile and apply safe audit fixes
        run: |
          npm install --package-lock-only
          npm audit fix
      - name: Verify installed framework versions
        run: |
          npm ls next react react-dom --depth=1
          node --input-type=module <<'NODE'
          import pkg from './node_modules/next/package.json' with { type: 'json' };
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          if (major < 16 || (major === 16 && (minor < 3 || (minor === 3 && patch < 6)))) {
            throw new Error(`Expected Next.js >= 16.3.6, found ${pkg.version}`);
          }
          console.log(`Validated Next.js ${pkg.version}`);
          NODE
      - name: Require zero known vulnerabilities
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build
      - name: Commit remediated dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh dependencies after security remediation"
          git push
