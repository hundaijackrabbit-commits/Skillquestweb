name: Innovation Management validation

on:
  push:
    branches:
      - audit/editorial-innovation-management-clean-slug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify effective Innovation Management guide
        run: |
          node --input-type=module <<'NODE'
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';
          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const checks = [
            ['innovation-management', 'innovation-management'],
            ['innovation-management-1', 'innovation-management'],
            ['change-management-2', 'change-management'],
            ['strategic-planning-1', 'strategic-planning'],
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
          ];
          for (const [reference, expectedSlug] of checks) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expectedSlug) {
              throw new Error(`${reference}: expected ${expectedSlug}, received ${resolved?.slug ?? 'null'}`);
            }
            console.log(`${reference} -> ${resolved.slug}`);
          }

          const innovation = resolveSkillReference('innovation-management');
          if (!innovation?.shortDefinition?.startsWith('Innovation management is the discipline')) {
            throw new Error('Reviewed Innovation Management definition is not effective');
          }
          if (JSON.stringify(innovation?.careers ?? []) !== JSON.stringify(['product-manager'])) {
            throw new Error(`Innovation Management career relationships must contain only product-manager; received ${JSON.stringify(innovation?.careers ?? [])}`);
          }
          if ((innovation?.scholarlyNotes?.length ?? 0) < 3) {
            throw new Error('Innovation Management evidence notes are incomplete');
          }
          if (!(innovation?.tools ?? []).includes('Innovation portfolio boards')) {
            throw new Error('Innovation Management reviewed tools are not effective');
          }
          const expectedRelated = ['strategic-planning', 'change-management', 'problem-solving', 'critical-thinking', 'project-management'];
          for (const related of expectedRelated) {
            if (!(innovation?.relatedSkills ?? []).includes(related)) {
              throw new Error(`Missing expected related skill ${related}`);
            }
            if (!resolveSkillReference(related)) {
              throw new Error(`Related skill ${related} does not resolve`);
            }
          }
          console.log('Reviewed Innovation Management content is effective.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
