name: Strategic Planning validation

on:
  push:
    branches:
      - audit/editorial-strategic-planning-clean-slug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify effective Strategic Planning guide
        run: |
          node --input-type=module <<'NODE'
          import { loadEffectiveSkillGraph } from './scripts/lib/effective-skills.mjs';
          const { resolveSkillReference } = loadEffectiveSkillGraph();
          const checks = [
            ['strategic-planning', 'strategic-planning'],
            ['strategic-planning-1', 'strategic-planning'],
            ['team-building-1', 'team-building'],
            ['performance-management-1', 'performance-management'],
          ];
          for (const [reference, expectedSlug] of checks) {
            const resolved = resolveSkillReference(reference);
            if (resolved?.slug !== expectedSlug) {
              throw new Error(`${reference}: expected ${expectedSlug}, received ${resolved?.slug ?? 'null'}`);
            }
            console.log(`${reference} -> ${resolved.slug}`);
          }
          const strategic = resolveSkillReference('strategic-planning');
          if (!strategic?.shortDefinition?.startsWith('Strategic planning is the practice of turning')) {
            throw new Error('Reviewed Strategic Planning definition is not effective');
          }
          if (JSON.stringify(strategic?.careers ?? []) !== JSON.stringify(['product-manager'])) {
            throw new Error(`Strategic Planning career relationships must contain only product-manager; received ${JSON.stringify(strategic?.careers ?? [])}`);
          }
          if ((strategic?.scholarlyNotes?.length ?? 0) < 3) {
            throw new Error('Strategic Planning evidence notes are incomplete');
          }
          console.log('Reviewed Strategic Planning content is effective.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
